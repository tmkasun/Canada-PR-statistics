<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Subscription</title>
</head>

<body
    style="font-family: Arial, sans-serif; line-height: 1.6; color: #333333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f8f8f8; border-radius: 5px;">
        <tr>
            <td style="padding: 20px;">
                <h1 style="color: #0056b3; text-align: center;">Verify Your Subscription</h1>
                <!-- <p style="margin-bottom: 20px;">Dear Subscriber,</p> -->
                <!-- <p style="margin-bottom: 20px;">Thank you for subscribing to our newsletter. To complete your
                    subscription, please click the button below to verify your email address:</p> -->
                <table width="100%" cellpadding="0" cellspacing="0">
                    <tr>
                        <td align="center">
                            <a href="#" id="verifyLink"
                                style="display: inline-block; background-color: #0056b3; color: #ffffff; text-decoration: none; padding: 10px 20px; border-radius: 5px; font-weight: bold;">Verify
                                Email</a>
                        </td>
                    </tr>
                </table>
                <p style="margin-top: 20px;">If the button above doesn't work, you can copy and paste the following link
                    into your browser:</p>
                <p style="word-break: break-all; color: #0056b3;"><span id="verifyUrl">Error</span></p>
                <!-- <p style="margin-top: 20px;">You've subscribed to receive updates on:</p> -->
                <!-- <ul style="list-style-type: none; padding-left: 0;" id="subscriptionsList"> -->
                <!-- Subscription items will be inserted here by JavaScript -->
                <!-- </ul> -->
                <p style="margin-top: 20px;">If you didn't request this subscription, you can safely ignore this email.
                </p>
                <p style="margin-top: 20px;">Best regards,<br>Knnect</p>
            </td>
        </tr>
    </table>

    <script>
        // This script will run when the email is opened in a browser that supports JavaScript
        // In most email clients, this script will not run due to security restrictions
        (function () {
            // Function to get URL parameters
            function getUrlParameter(name) {
                name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
                var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
                var results = regex.exec(location.search);
                return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
            }

            // Get verification token from URL
            var token = getUrlParameter('token');
            if (token) {
                var verifyUrl = 'https://example.com/verify?token=' + token;
                document.getElementById('verifyUrl').textContent = verifyUrl;
                document.getElementById('verifyLink').href = verifyUrl;
            }

            // Get subscriptions from URL
            var subscriptions = getUrlParameter('subscriptions');
            if (subscriptions) {
                var subscriptionsList = document.getElementById('subscriptionsList');
                subscriptions.split(',').forEach(function (item) {
                    var li = document.createElement('li');
                    li.textContent = '✓ ' + item;
                    li.style.marginBottom = '5px';
                    subscriptionsList.appendChild(li);
                });
            }
        })();
    </script>
</body>

</html>
